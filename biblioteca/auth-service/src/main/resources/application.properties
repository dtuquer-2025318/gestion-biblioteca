# Configuración del Servidor Tomcat
server.port=8081
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100

# Nombre de la aplicación
spring.application.name=auth-service

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool de Conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT
jwt.secret=${JWT_SECRET:8Zz5twkAG5aBqY6A1c8fE2gH4jK6mN8pQ0rS2tU4vW6xY8z0aB2cD4eF6gH8jK0m}
jwt.expiration=86400000

# Usuario Admin por defecto
app.admin.default-email=admin@universidad.edu.gt
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin1234*}

# Logs
logging.level.root=INFO
logging.level.gt.edu.kinal.biblioteca=INFO